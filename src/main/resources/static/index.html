dale<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conflict Tracker</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>Conflict Tracker</h1>
    <table id="conflictsTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Start Date</th>
                <th>Status</th>
                <th>Description</th>
                <th>Countries</th>
            </tr>
        </thead>
        <tbody>
            <!-- Data will be inserted here -->
        </tbody>
    </table>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('/api/v1/conflicts')
                .then(response => response.json())
                .then(data => {
                    const tableBody = document.querySelector('#conflictsTable tbody');
                    data.forEach(conflict => {
                        const row = document.createElement('tr');

                        const countries = conflict.countries.map(c => c.name).join(', ');

                        row.innerHTML = `
                            <td>${conflict.id}</td>
                            <td>${conflict.name}</td>
                            <td>${conflict.startDate}</td>
                            <td>${conflict.status}</td>
                            <td>${conflict.description}</td>
                            <td>${countries}</td>
                        `;
                        tableBody.appendChild(row);
                    });
                })
                .catch(error => console.error('Error fetching conflicts:', error));
        });
    </script>
</body>
</html>
