spring:
  application:
    name: conflict-tracker

  # H2 Database Configuration (Development)
  datasource:
    url: jdbc:h2:mem:conflictdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2 Console for debugging
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA/Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Disable SQL initialization - tables will be auto-created by Hibernate
  sql:
    init:
      mode: never

server:
  port: 8080
